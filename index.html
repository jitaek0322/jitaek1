<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="군생활">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<title>군생활 관리</title>
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;
  src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2")}
:root{
  --bg:#06131F; --bg2:#0B1F3A; --card:#0F2742; --card2:#143253; --line:rgba(160,195,235,.12);
  --text:#EAF1FA; --sub:#8FA6C1; --dim:#5F7894; --gold:#D6AF48; --gold2:#F1D58A;
  --sea:#3B8EDB; --sea2:#6FB3F0; --red:#E8707A; --green:#52C792;
  --r:18px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,.tap,.cal .d{touch-action:manipulation}
/* iOS는 16px보다 작은 입력칸을 누르면 화면을 확대하므로 16px 고정 */
input,select,textarea,.inp{font-size:16px!important}
html,body,button,input,select,textarea,table{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:
  radial-gradient(120% 60% at 50% -10%, #12345a 0%, transparent 60%), var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b))}
header.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px}
.brand small{display:block;font-weight:500;color:var(--sub);font-size:12px;letter-spacing:.5px}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
h2{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.6px;margin:22px 4px 10px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
h2 button{font-size:13px;text-transform:none;letter-spacing:0}
.card{background:linear-gradient(180deg,var(--card),#0d2340);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.hero{position:relative;overflow:hidden;padding:20px 18px 18px;background:linear-gradient(160deg,#143a66 0%,#0d2645 55%,#0a1d36 100%);border:1px solid rgba(214,175,72,.25)}
.hero:after{content:"";position:absolute;inset:auto -20% -40px -20%;height:90px;background:radial-gradient(60% 100% at 50% 100%,rgba(59,142,219,.25),transparent);pointer-events:none}
.hero .row1{display:flex;justify-content:space-between;align-items:center;color:var(--gold2);font-size:13px;font-weight:600;letter-spacing:.4px}
.insig{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.insig i{display:block;width:5px;height:14px;border-radius:1px;background:var(--gold)}
.dday{font-size:58px;font-weight:800;letter-spacing:-2px;margin:10px 0 0;line-height:1;font-variant-numeric:tabular-nums}
.dday span{font-size:20px;font-weight:600;color:var(--sub);letter-spacing:0;margin-left:6px}
.sub{color:var(--sub);font-size:13px}
.pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold2)}
.voyage{margin:18px 0 4px}
.voyage svg{width:100%;height:auto;display:block}
.vlab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-size:22px;font-weight:750;margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--dim);margin-top:2px}
.gold{color:var(--gold2)} .sea{color:var(--sea2)} .green{color:var(--green)} .red{color:var(--red)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--sub);font-size:12px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(59,142,219,.16);color:var(--sea2);font-weight:600;white-space:nowrap}
.chip.g{background:rgba(214,175,72,.16);color:var(--gold2)}
.chip.r{background:rgba(232,112,122,.16);color:var(--red)}
.chip.n{background:rgba(255,255,255,.07);color:var(--sub)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:14px 0}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:650;background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(180deg,#e2bd5c,#c99c2e);color:#13233a;border:0}
.btn.sea{background:linear-gradient(180deg,#4a9be6,#2c74b3);border:0;color:#fff}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
.link{background:none;border:0;color:var(--sea2);padding:0;font-weight:600}
.x{background:none;border:0;color:var(--dim);font-size:18px;padding:4px 6px}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--dim);display:grid;place-items:center;flex:none;background:transparent;padding:0}
.check.on{background:var(--green);border-color:var(--green)}
.check.on:after{content:"";width:10px;height:6px;border:solid #06231a;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sea),var(--sea2))}
.bar.g i{background:linear-gradient(90deg,#b8902c,var(--gold2))}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--card2);color:var(--text)}
.banner{display:flex;gap:12px;align-items:center;background:rgba(214,175,72,.1);border:1px solid rgba(214,175,72,.3);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:13px}
.banner b{color:var(--gold2)}
/* calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-h b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w{font-size:11px;color:var(--dim);padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:10px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.cal .d.o{opacity:.25}
.cal .d.today{color:var(--gold2);font-weight:800}
.cal .d.sel{background:var(--card2);outline:1px solid rgba(214,175,72,.4)}
.cal .d.lv{background:rgba(82,199,146,.1)}
.cal .d .dots{display:flex;gap:2px;margin-top:3px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--sea2)}
.cal .sun{color:#ef8f97} .cal .sat{color:#8fbcef}
/* table */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:10px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr.cur td{color:var(--gold2);font-weight:700}
td.r{text-align:right}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(7,21,38,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--gold2)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility .25s}
.sheet.on{transform:none;visibility:visible}
.sheet .in{max-width:520px;margin:0 auto;background:#0e2440;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-b));max-height:88dvh;overflow:auto}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.inp{width:100%;background:#0a1b31;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;min-height:46px;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:rgba(214,175,72,.6)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog .t{flex:1}.tog .t b{display:block;font-weight:600}.tog .t small{color:var(--sub);font-size:12px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:#24405f;transition:.2s}
.sw i:after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i:after{transform:translateX(20px)}
.sw input:disabled+i{opacity:.4}
.note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55}
.code{font-size:12px;font-variant-numeric:tabular-nums;background:#0a1b31;border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;color:var(--sea2)}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#1b3d63;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
.steps{margin:8px 0 0;padding-left:18px;color:var(--sub);font-size:13px}
.steps li{margin:4px 0}

/* ============ 애니메이션 ============ */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes shine{0%,55%{background-position:130% 0}100%{background-position:-130% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes dash{to{stroke-dashoffset:-26}}
@keyframes puff{0%{opacity:.55;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-14px,-10px) scale(1.8)}}
@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(7deg) scaleX(.88)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes tabpop{0%{transform:translateY(0)}35%{transform:translateY(-4px) scale(1.12)}100%{transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(82,199,146,.6)}100%{box-shadow:0 0 0 7px rgba(82,199,146,0)}}
@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
@keyframes glow{0%,100%{text-shadow:0 0 0 rgba(241,213,138,0)}50%{text-shadow:0 0 18px rgba(241,213,138,.35)}}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

#view.anim>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
#view.anim .grid>.stat{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(120ms + var(--j,0) * 60ms)}
#view.anim .bar i{transform-origin:left;animation:grow 1s .25s cubic-bezier(.2,.8,.2,1) both}

.hero{isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(105deg,transparent 35%,rgba(241,213,138,.13) 50%,transparent 65%);background-size:250% 100%;animation:shine 7s ease-in-out infinite}
.dday{animation:glow 4s ease-in-out infinite}
.dot.on{animation:pulse 1.8s ease-out infinite}
.banner>span:first-child{display:inline-block;transform-origin:50% 10%;animation:ring 3.5s ease-in-out infinite}

/* 지게차 */
.fk{transition:transform 1.6s cubic-bezier(.25,.8,.25,1)}
.fk-body{animation:bob .45s ease-in-out infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}
/* 도착 후에도 바퀴·매연·도로가 계속 움직여요 (멈추지 않음) */
.fk.arrived .fk-body{animation:bob .45s ease-in-out infinite,idle-rev 3.2s ease-in-out infinite}
@keyframes idle-rev{0%,100%{translate:0 0}50%{translate:1.2px 0}}
.road-dash{animation:dash 1.2s linear infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.4s ease-out infinite}
.puff.p2{animation-delay:.7s}
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.8s ease-in-out infinite}
.trail{transition:stroke-dashoffset 1.6s cubic-bezier(.25,.8,.25,1)}

/* 터치 반응 */
.btn,.stat,.check,.cal .d,.x,.link,.seg button,.item{transition:transform .16s ease,background-color .2s,opacity .2s,box-shadow .2s}
.btn:active,.stat:active,.cal .d:active{transform:scale(.95)}
.x:active,.link:active{transform:scale(.88);opacity:.7}
.stat:hover{box-shadow:0 6px 24px rgba(0,0,0,.25)}
.check.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.item.done-flash{background:rgba(82,199,146,.08);border-radius:12px}

/* 탭 바 */
nav.tabs .in{position:relative}
nav.tabs .ind{position:absolute;top:-6px;left:0;width:20%;height:3px;display:flex;justify-content:center;transition:transform .35s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
nav.tabs .ind:after{content:"";width:26px;height:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 10px rgba(214,175,72,.7)}
nav.tabs button{transition:color .2s}
nav.tabs button.on svg{animation:tabpop .45s cubic-bezier(.3,1.6,.5,1)}

/* 세그먼트 */
.seg{position:relative}
.seg .sind{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:var(--card2);transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.seg button{position:relative;z-index:1}
.seg button.on{background:none}

/* 시트 · 토스트 */
.sheet-bg{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet .in>*{transition:opacity .3s .05s}
#toast{transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}

.confetti{position:fixed;width:7px;height:11px;border-radius:2px;pointer-events:none;z-index:80;animation:fall .9s cubic-bezier(.2,.7,.4,1) forwards}

/* ============ 확장 화면 ============ */
#view.anim .grid3>.stat{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(120ms + var(--j,0) * 60ms)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .stat{padding:12px}.grid3 .stat .v{font-size:20px}.grid3 .stat .k{font-size:11.5px}
.hint{font-size:11px;color:var(--dim);font-weight:500;text-transform:none;letter-spacing:0}
.banner.danger{background:rgba(232,112,122,.12);border-color:rgba(232,112,122,.4)}.banner.danger b{color:var(--red)}
.banner[role=button]{cursor:pointer}
.dday.red{color:var(--red)}
.tap{cursor:pointer}.tap:active{background:rgba(255,255,255,.03)}
.chev{color:var(--dim);font-size:20px}
/* 남은 기간 환산 */
.funrow{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 4px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.funrow::-webkit-scrollbar{display:none}
.fun{flex:0 0 auto;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:auto auto;column-gap:6px;align-items:baseline;min-width:118px}
.fun span{grid-row:span 2;font-size:22px;align-self:center}
.fun b{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}.fun small{display:none}
.fun em{font-style:normal;font-size:11.5px;color:var(--sub);grid-column:2}
/* 기분 */
.moods{display:flex;justify-content:space-between;gap:4px}
.mood{flex:1;background:none;border:1px solid transparent;border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,background .2s,border-color .2s}
.mood span{font-size:28px;filter:grayscale(.85);opacity:.6;transition:filter .2s,opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.mood small{font-size:11px;color:var(--dim)}
.mood.on{background:rgba(214,175,72,.12);border-color:rgba(214,175,72,.35)}
.mood.on span{filter:none;opacity:1;transform:scale(1.12)}.mood.on small{color:var(--gold2)}
.mood.pop span{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
/* 더보기 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;background:linear-gradient(180deg,var(--card),#0d2340);border:1px solid var(--line);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:4px;min-height:118px;transition:transform .16s}
.tile:active{transform:scale(.96)}
.tile .te{font-size:28px;margin-bottom:6px}
.tile b{font-size:15px}.tile small{font-size:12px;color:var(--sub);line-height:1.35}
.tile.alert{border-color:rgba(232,112,122,.5);box-shadow:0 0 0 1px rgba(232,112,122,.2) inset}
#view.anim .tiles>.tile{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.anim .tiles>.tile:nth-child(2){animation-delay:40ms}#view.anim .tiles>.tile:nth-child(3){animation-delay:80ms}#view.anim .tiles>.tile:nth-child(4){animation-delay:120ms}
#view.anim .tiles>.tile:nth-child(5){animation-delay:160ms}#view.anim .tiles>.tile:nth-child(6){animation-delay:200ms}#view.anim .tiles>.tile:nth-child(7){animation-delay:240ms}#view.anim .tiles>.tile:nth-child(8){animation-delay:280ms}
.subhd{display:flex;align-items:center;gap:6px;margin:0 0 12px}
.subhd b{font-size:19px}
.subhd .back{font-size:30px;line-height:1;padding:0 8px 4px 0;color:var(--sub)}
/* 선택 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#0a1b31;color:var(--sub);font-weight:600;font-size:14px;transition:.18s}
.pick input:checked+span{background:rgba(214,175,72,.16);border-color:rgba(214,175,72,.55);color:var(--gold2);transform:scale(1.03)}

<script type="module">
import * as L from './logic.js';

/* ============ 상태 ============ */
const KEY = 'navylog.v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
let today = L.kstToday();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); return merge(L.defaultData(), d); }
  } catch (_) {}
  return L.defaultData();
}
function merge(base, d) {
  const out = { ...base, ...d };
  out.profile = { ...base.profile, ...(d.profile || {}), promo: { ...base.profile.promo, ...(d.profile?.promo || {}) } };
  out.pay = { ...base.pay, ...(d.pay || {}) };
  out.savings = { ...base.savings, ...(d.savings || {}) };
  out.notify = { ...base.notify, ...(d.notify || {}) };
  out.fitness = { ...base.fitness, ...(d.fitness || {}), goals: { ...base.fitness.goals, ...(d.fitness?.goals || {}) } };
  if (!Array.isArray(out.fitness.records)) out.fitness.records = [];
  return out;
}
let S = load();
let meta = (() => { try { return JSON.parse(localStorage.getItem(KEY + '.meta')) || {}; } catch (_) { return {}; } })();

function save(silent) {
  meta.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(KEY + '.meta', JSON.stringify(meta)); } catch (_) {}
  Cloud.push();
  if (!silent) render();
}

/* ============ Firebase 동기화 · 푸시 ============ */
const Cloud = {
  on: false, user: null, db: null, fs: null, msg: null, app: null, timer: null, ready: false,
  async init() {
    const cfg = self.FIREBASE_CONFIG || {};
    if (!cfg.apiKey) { setSync(false, '폰에 저장'); return; }
    try {
      const v = '10.14.1', base = `https://www.gstatic.com/firebasejs/${v}/`;
      const [{ initializeApp }, auth, fs] = await Promise.all([
        import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      this.app = initializeApp(cfg); this.fs = fs; this.db = fs.getFirestore(this.app);
      const a = auth.getAuth(this.app);
      setSync(false, '연결 중…');
      auth.onAuthStateChanged(a, async (u) => {
        if (!u) { await auth.signInAnonymously(a); return; }
        this.user = u; this.on = true;
        await this.pull();
        this.ready = true; setSync(true, '동기화됨');
        this.push();
      });
    } catch (e) { console.error(e); setSync(false, '오프라인'); }
  },
  ref() { return this.fs.doc(this.db, 'users', this.user.uid); },
  async pull() {
    try {
      const snap = await this.fs.getDoc(this.ref());
      if (snap.exists()) {
        const r = snap.data();
        if (r.json && (r.updatedAt || 0) > (meta.updatedAt || 0)) {
          S = merge(L.defaultData(), JSON.parse(r.json)); meta.updatedAt = r.updatedAt;
          localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(KEY + '.meta', JSON.stringify(meta));
          render();
        }
      }
    } catch (e) { console.error(e); }
  },
  push() {
    if (!this.on || !this.ready) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(async () => {
      try {
        const { setDoc } = this.fs;
        await setDoc(this.ref(), { json: JSON.stringify(S), updatedAt: meta.updatedAt || Date.now() }, { merge: true });
        if (S.widgetKey) {
          await setDoc(this.fs.doc(this.db, 'widgets', S.widgetKey), { owner: this.user.uid, json: JSON.stringify(L.widgetSummary(S, L.kstToday())), updatedAt: Date.now() });
        }
        setSync(true, '동기화됨');
      } catch (e) { console.error(e); setSync(false, '저장 실패'); }
    }, 600);
  },
  async enablePush() {
    if (!this.on) throw new Error('Firebase 설정이 필요해요 (README 2단계)');
    if (!('Notification' in window) || !('serviceWorker' in navigator)) throw new Error('이 브라우저는 푸시를 지원하지 않아요. 홈 화면에 추가한 앱에서 열어주세요.');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('알림 권한이 거부됐어요. 설정 > 알림 > 군생활에서 허용해주세요.');
    const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    const m = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js');
    const messaging = m.getMessaging(this.app);
    const token = await m.getToken(messaging, { vapidKey: self.FIREBASE_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error('토큰을 받지 못했어요. 잠시 후 다시 시도해주세요.');
    await this.fs.setDoc(this.ref(), { tokens: this.fs.arrayUnion(token), pushOn: true }, { merge: true });
    meta.pushToken = token; localStorage.setItem(KEY + '.meta', JSON.stringify(meta));
    return token;
  },
};
function setSync(on, txt) { $('#syncDot').className = 'dot' + (on ? ' on' : ''); $('#syncTxt').textContent = txt; }

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: './' }).catch(() => {});
}
// 확대·축소 막기 (iOS Safari는 viewport 설정을 무시하는 경우가 있어 제스처도 차단)
['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
const standalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

/* ============ 공통 UI ============ */
const ICONS = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
  leave: '<path d="M4 8h16v11H4z"/><path d="M9 8V5.5h6V8"/><path d="M4 13h16"/>',
  pay: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/>',
  plan: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>',
  set: '<circle cx="12" cy="5" r="2"/><path d="M12 7v14"/><path d="M7 11h10"/><path d="M4.5 15a7.5 7.5 0 0 0 15 0"/>',
  more: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><circle cx="16.75" cy="16.75" r="3.4"/>',
};
const TABS = [['home', '홈'], ['leave', '출타'], ['pay', '돈'], ['plan', '일정·목표'], ['more', '더보기']];
let tab = location.hash.slice(1) || 'home';
let bootSub = null; if (tab === 'set') { tab = 'more'; bootSub = 'set'; }
if (!TABS.some((t) => t[0] === tab)) tab = 'home';
function renderTabs() {
  const box = $('#tabs');
  if (!box.children.length) box.innerHTML = '<span class="ind"></span>' + TABS.map(([k, n]) => `<button data-tab="${k}" aria-label="${n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${n}</button>`).join('');
  box.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  box.querySelector('.ind').style.transform = `translateX(${TABS.findIndex((t) => t[0] === tab) * 100}%)`;
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; if (b.dataset.tab === tab) { if (tab === 'more' && sub) { sub = null; render(true); scrollTo(0, 0); } return; } tab = b.dataset.tab; sub = null; history.replaceState(null, '', '#' + tab); render(true); scrollTo(0, 0); });

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2000); }

let sheetSubmit = null;
function openSheet(html, onSubmit) {
  $('#sheetBody').innerHTML = html; sheetSubmit = onSubmit;
  $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on');

const FunCar = (() => {

/* ============ 일정 · 목표 ============ */
let calYM = today.slice(0, 7), selDay = today;
function viewPlan() {
  return `${segBar('plan', [['events', '일정'], ['goals', '목표']])}
  ${SEG.plan === 'events' ? viewCal() : viewGoals()}`;
}
function viewCal() {
  const [y, m] = calYM.split('-').map(Number);
  const first = `${calYM}-01`; const startDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const start = L.addDays(first, -startDow);
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = L.addDays(start, i); const inM = d.slice(0, 7) === calYM; const dow = i % 7;
    if (i >= 35 && !inM && d.slice(0, 7) > calYM) break;
    const n = S.events.filter((e) => e.date === d).length;
    const lv = S.leaves.some((l) => !L.isOuting(l.kind) && l.start <= d && l.end >= d);
    cells += `<button class="d ${inM ? '' : 'o'} ${d === today ? 'today' : ''} ${d === selDay ? 'sel' : ''} ${lv ? 'lv' : ''} ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}" data-day="${d}">${Number(d.slice(8))}<span class="dots">${'<i></i>'.repeat(Math.min(3, n))}</span></button>`;
  }
  const dayEv = S.events.filter((e) => e.date === selDay).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  const upcoming = S.events.filter((e) => e.date > selDay).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).slice(0, 5);
  const evDel = (e) => evRow(e, true).replace('</div></div>', `</div><button class="x" data-del-ev="${e.id}" aria-label="삭제">×</button></div>`);
  return `<div class="card">
    <div class="cal-h"><button class="x" data-cal="-1" aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button class="x" data-cal="1" aria-label="다음 달">›</button></div>
    <div class="cal">${'일월화수목금토'.split('').map((w) => `<div class="w">${w}</div>`).join('')}${cells}</div>
  </div>
  <h2>${L.fmtDate(selDay)} <button class="link" data-add="event">+ 일정 추가</button></h2>
  <div class="card"><div class="list">${dayEv.length ? dayEv.map(evDel).join('') : '<div class="empty">이 날은 일정이 없어요</div>'}</div></div>
  ${upcoming.length ? `<h2>다가오는 일정</h2><div class="card"><div class="list">${upcoming.map(evDel).join('')}</div></div>` : ''}`;
}
function viewGoals() {
  const last7 = [...Array(7)].map((_, i) => L.addDays(today, i - 6));
  return `<div class="card"><div class="list">${S.goals.length ? S.goals.map((g) => {
    const cnt = last7.filter((d) => g.logs?.[d]).length;
    return `<div class="item" style="flex-wrap:wrap"><button class="check ${g.logs?.[today] ? 'on' : ''}" data-goal="${g.id}" aria-label="체크"></button>
      <div class="t"><b>${esc(g.emoji || '')} ${esc(g.title)}</b><small>🔥 ${L.goalStreak(g, today)}일 연속 · 최근 7일 ${cnt}/7 · 누적 ${Object.keys(g.logs || {}).length}일</small></div>
      <button class="x" data-del-goal="${g.id}" aria-label="삭제">×</button>
      <div style="display:flex;gap:4px;width:100%;padding-left:38px;margin-top:8px">${last7.map((d) => `<i style="flex:1;height:6px;border-radius:3px;background:${g.logs?.[d] ? 'var(--green)' : 'rgba(255,255,255,.08)'}"></i>`).join('')}</div></div>`;
  }).join('') : '<div class="empty">목표를 추가하고 매일 체크해보세요</div>'}</div></div>

  <div class="note" style="text-align:center">체크하지 않은 목표가 있으면 매일 18시에 알려드려요</div>`;

/* ---- 체력 기록 ---- */
function spark(vals, better) {
  if (vals.length < 2) return '';
  const W = 120, H = 34, v = vals.slice(-8).map((x) => x.v), mn = Math.min(...v), mx = Math.max(...v), rg = mx - mn || 1;
  const pts = v.map((y, i) => [4 + (i * (W - 8)) / (v.length - 1), better === 'down' ? 4 + ((y - mn) / rg) * (H - 8) : H - 4 - ((y - mn) / rg) * (H - 8)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const lp = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><path d="${d}" fill="none" stroke="var(--gold2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3" fill="var(--gold2)"/></svg>`;
}
function viewFitness() {
  const fs = L.fitStats(S);
  const recs = [...(S.fitness?.records || [])].sort((a, b) => b.date.localeCompare(a.date));
  const fmt = (it, v) => (it.key === 'run' ? L.fmtRun(v) : v ? `${v}${it.unit}` : '—');
  return `${subHead('💪 체력 기록', '<button class="link" data-edit="fitGoals">목표 설정</button>')}
  ${fs.map((f) => {
    const good = f.delta == null ? null : f.better === 'up' ? f.delta > 0 : f.delta < 0;
    const dtxt = f.delta == null || f.delta === 0 ? '' : f.key === 'run' ? `${f.delta < 0 ? '−' : '+'}${Math.abs(f.delta)}초` : `${f.delta > 0 ? '+' : ''}${f.delta}회`;
    return `<div class="card fitcard"><div style="flex:1;min-width:0"><div class="sub">${f.name}</div>
      <div class="fitv">${fmt(f, f.last?.v)} ${dtxt ? `<span class="${good ? 'green' : 'red'}" style="font-size:14px">${good ? '▲' : '▼'} ${dtxt}</span>` : ''}</div>
      <div class="note" style="margin-top:2px">최고 ${fmt(f, f.best)}${f.goal ? ` · 목표 ${fmt(f, f.goal)} ${f.gap > 0 ? `<b class="gold">(${f.key === 'run' ? f.gap + '초 단축' : f.gap + '회 더'})</b>` : f.gap != null ? '<b class="green">달성 🎉</b>' : ''}` : ''}</div></div>${spark(f.vals, f.better)}</div>`;
  }).join('')}
  <button class="btn pri full" style="margin-top:12px" data-add="fit">+ 기록 추가</button>
  <h2>기록 내역</h2>
  <div class="card" style="padding:6px 16px">${recs.length ? `<table><tr><td class="sub">날짜</td><td class="sub r">팔굽</td><td class="sub r">윗몸</td><td class="sub r">3km</td><td></td></tr>${recs.map((r) => `<tr><td>${L.fmtDate(r.date, false)}</td><td class="r">${r.pushup || '—'}</td><td class="r">${r.situp || '—'}</td><td class="r">${L.fmtRun(r.run)}</td><td class="r" style="width:30px">${delBtn('fit', r.id)}</td></tr>`).join('')}</table>` : empty('측정 기록을 남겨보세요')}</div>`;
}

      ${field('금액 (원)', inp('amount', '', 'number', 'required min="1" inputmode="numeric" placeholder="0" autofocus'))}
      <div class="chips" id="ecats">${S.expenseCats.map((c, i) => `<label class="pick"><input type="radio" name="cat" value="${esc(c)}" ${i === 0 ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}</div>
      <div class="row">${field('날짜', inp('date', MON.money === today.slice(0, 7) ? today : `${MON.money}-01`, 'date', 'required'))}${field('메모 (선택)', inp('memo', '', 'text', 'placeholder="예: 냉동, 음료"'))}</div>${actions('기록')}</form>`,
    (f) => { S.expenses.push({ id: uid(), date: f.date, cat: f.cat, amount: Number(f.amount) || 0, memo: f.memo.trim() }); MON.money = f.date.slice(0, 7); save(); toast('기록했어요'); });
  },
  drive() {
    const last = [...(S.drives || [])].sort((a, b) => b.date.localeCompare(a.date))[0];
    openSheet(`<h3>운행 기록</h3><form>
      <div class="chips">${L.VEHICLES.map((v) => `<label class="pick"><input type="radio" name="vehicle" value="${v}" ${(last?.vehicle || '지게차') === v ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div>
      <div class="row">${field('날짜', inp('date', today, 'date', 'required'))}${field('차량명 · 번호 (선택)', inp('name', last?.name || '', 'text', 'placeholder="예: 3톤 지게차"'))}</div>
      <div class="row">${field('시작', inp('start', '09:00', 'time', 'required'))}${field('종료', inp('end', '12:00', 'time', 'required'))}</div>
      <div class="row">${field('거리 km (선택)', inp('km', '', 'number', 'step="0.1" min="0" inputmode="decimal"'))}${field('화물 · 작업', inp('cargo', '', 'text', 'placeholder="예: 탄약 상하차"'))}</div>
      ${field('메모 (선택)', inp('memo'))}${actions('기록')}</form>`,
    (f) => { S.drives.push({ id: uid(), date: f.date, vehicle: f.vehicle, name: f.name.trim(), start: f.start, end: f.end, km: Number(f.km) || 0, cargo: f.cargo.trim(), memo: f.memo.trim() }); save(); toast(`운행 ${n1(L.hoursBetween(f.start, f.end))}시간 기록`); });
  },
  fit() {
    openSheet(`<h3>체력 기록</h3><form>
      ${field('측정일', inp('date', today, 'date', 'required'))}
      <div class="row">${field('팔굽혀펴기 (회)', inp('pushup', '', 'number', 'min="0" inputmode="numeric"'))}${field('윗몸일으키기 (회)', inp('situp', '', 'number', 'min="0" inputmode="numeric"'))}</div>
      ${field('3km 뜀걸음 (분:초)', inp('run', '', 'text', 'placeholder="13:20" inputmode="numeric" pattern="\\d{1,2}:\\d{2}"'))}
      <div class="note" style="margin-top:-4px">한 항목만 입력해도 돼요.</div>${actions('기록')}</form>`,
    (f) => {
      const r = { id: uid(), date: f.date, pushup: Number(f.pushup) || 0, situp: Number(f.situp) || 0, run: L.parseRun(f.run) };
      if (!r.pushup && !r.situp && !r.run) { toast('기록을 하나 이상 입력하세요'); return false; }
      S.fitness.records.push(r); save(); toast('기록했어요 💪');
    });
  },
  fitGoals() {
    const g = S.fitness.goals || {};
    openSheet(`<h3>체력 목표</h3><form>
      <div class="row">${field('팔굽혀펴기 (회)', inp('pushup', g.pushup || '', 'number', 'min="0" inputmode="numeric"'))}${field('윗몸일으키기 (회)', inp('situp', g.situp || '', 'number', 'min="0" inputmode="numeric"'))}</div>
      ${field('3km 뜀걸음 (분:초)', inp('run', g.run ? L.fmtRun(g.run) : '', 'text', 'placeholder="12:30"'))}
      <div class="note" style="margin-top:-4px">목표 등급 기준은 부대 체력검정 기준표를 보고 입력하세요.</div>${actions()}</form>`,
    (f) => { S.fitness.goals = { pushup: Number(f.pushup) || 0, situp: Number(f.situp) || 0, run: L.parseRun(f.run) }; save(); });
  },
  merit() {
    openSheet(`<h3>양호 · 과실 기록</h3><form>
      <div class="chips"><label class="pick g"><input type="radio" name="type" value="양호" checked><span>👍 양호</span></label><label class="pick r"><input type="radio" name="type" value="과실"><span>⚠️ 과실</span></label></div>
      <div class="row">${field('날짜', inp('date', today, 'date', 'required'))}${field('점수', inp('points', '1', 'number', 'required min="0" step="0.5" inputmode="decimal"'))}</div>
      ${field('사유', inp('reason', '', 'text', 'placeholder="예: 정비 우수, 지시 불이행"'))}
      <div class="note" style="margin-top:-4px">주말근무 양호 점수는 주말근무 탭에 기록하면 자동으로 들어가요.</div>${actions('기록')}</form>`,
    (f) => {
      S.merits.push({ id: uid(), date: f.date, type: f.type, points: Number(f.points) || 0, reason: f.reason.trim() }); save();
      const fw = L.faultWindow(S, today);
      if (f.type === '과실' && fw.count >= 2) setTimeout(() => alert(fw.count >= 3 ? `최근 2개월 과실 ${fw.count}회 — 진급 누락 기준에 해당할 수 있어요.` : '최근 2개월 과실 2회 — 한 번 더 받으면 진급 누락 위험이에요.'), 300);
      else toast('기록했어요');
    });
  },
  ww() {
    openSheet(`<h3>주말근무 기록</h3><form id="wwf">
      ${field('작업 내용', inp('task', '', 'text', 'required placeholder="예: 화물 상하차, 차량 정비"'))}
      ${field('날짜', inp('date', lastWeekendDay(), 'date', 'required'))}
      <div class="row">${field('시작', inp('start', '09:00', 'time', 'required'))}${field('종료', inp('end', '13:00', 'time', 'required'))}</div>
      <div class="rule" id="wwprev" style="margin:0 0 12px"></div>${actions('기록')}</form>`,
    (f) => { S.weekendWork.push({ id: uid(), date: f.date, task: f.task.trim(), start: f.start, end: f.end }); save(); toast('주말근무를 기록했어요'); });
    const form = $('#wwf'), prev = $('#wwprev');
    const upd = () => {
      const fd = Object.fromEntries(new FormData(form)), h = L.hoursBetween(fd.start, fd.end);
      const before = (S.weekendWork || []).filter((w) => w.date === fd.date).reduce((s, w) => s + L.hoursBetween(w.start, w.end), 0);
      const tot = Math.min(8, before + h), b0 = Math.min(8, before);
      const good = Math.min(4, tot) - Math.min(4, b0), com = Math.max(0, tot - 4) - Math.max(0, b0 - 4), over = Math.max(0, before + h - 8) - Math.max(0, before - 8);
      prev.innerHTML = `<b>이 기록으로 받는 점수</b><div>${n1(h)}시간${before ? ` (이날 기존 ${n1(before)}시간 + 합계 ${n1(before + h)}시간)` : ''}</div><div><span class="chip g">양호 +${n1(good)}</span> <span class="chip">위로 +${n1(com)}</span>${over ? ` <span class="chip n">미인정 ${n1(over)}시간</span>` : ''}</div>`;
    };
    form.addEventListener('input', upd); upd();
  },
  anniv() {
    openSheet(`<h3>생일 · 기념일 추가</h3><form>
      <div class="chips"><label class="pick"><input type="radio" name="kind" value="생일" checked><span>🎂 생일</span></label><label class="pick"><input type="radio" name="kind" value="기념일"><span>💝 기념일</span></label></div>
      <div class="row">${field('이름', inp('name', '', 'text', 'required placeholder="예: 엄마 생신"'))}${field('누구 (선택)', inp('who', '', 'text', 'placeholder="예: 엄마"'))}</div>
      ${field('날짜', inp('date', '', 'date', 'required'))}
      <label class="tog" style="padding-top:0"><div class="t"><b>연도 모름</b><small>나이·주년 표시 안 함</small></div><span class="sw"><input type="checkbox" name="noYear"><i></i></span></label>
      <div class="note">생일이 음력이면 올해 양력 날짜로 넣어주세요.</div>${actions('추가')}</form>`,
    (f) => { S.anniversaries.push({ id: uid(), kind: f.kind, name: f.name.trim(), who: f.who.trim(), date: f.noYear ? `0000${f.date.slice(4)}` : f.date }); save(); toast('추가했어요'); });
  },
  etc() {
    openSheet(`<h3>기준 설정</h3><form>
      <div class="row">${field('봉급일 (매월)', inp('payday', S.payday, 'number', 'min="1" max="28" inputmode="numeric"'))}${field('위로휴가 1일 = 마일리지', inp('per', S.mileagePerDay, 'number', 'min="1" inputmode="numeric"'))}</div>
      ${field('가계부 분류 (쉼표로 구분)', inp('cats', S.expenseCats.join(', ')))}
      ${field('추가 휴일 (월급날 계산용, 쉼표로 구분)', `<textarea class="inp" name="hol" rows="2" placeholder="예: 2027-02-08, 2027-09-15">${esc((S.holidays || []).join(', '))}</textarea>`)}
      <div class="note" style="margin-top:-4px">주말과 신정·삼일절·어린이날·현충일·광복절·개천절·한글날·성탄절은 자동으로 빠져요. 설·추석·대체공휴일만 넣으면 돼요.</div>${actions()}</form>`,
    (f) => { S.payday = Math.min(28, Math.max(1, Number(f.payday) || 10)); S.mileagePerDay = Math.max(1, Number(f.per) || 10); S.holidays = [...new Set(f.hol.split(/[,\s]+/).map((x) => x.trim()).filter((x) => /^\d{4}-\d{2}-\d{2}$/.test(x)))].sort(); const c = f.cats.split(',').map((x) => x.trim()).filter(Boolean); if (c.length) S.expenseCats = [...new Set(c)]; save(); });
  },
});
function pckRow(c, i) { return `<div class="item" style="padding:9px 2px"><button type="button" class="check ${c.done ? 'on' : ''}" data-pchk="${i}" aria-label="체크"></button><div class="t"><b style="${c.done ? 'text-decoration:line-through;color:var(--sub)' : ''}">${esc(c.t)}</b></div><button type="button" class="x" data-pdel="${i}" aria-label="삭제">×</button></div>`; }

/* ============ 새 이벤트 처리 ============ */
function delItem(spec) {
  const [coll, id] = spec.split(':');
  const label = { drives: '운행 기록', expenses: '지출', merits: '상벌 기록', weekendWork: '주말근무 기록', anniversaries: '기념일', fit: '체력 기록', diary: '일기', leaves: '출타 기록' }[coll] || '항목';
  if (!confirm(`이 ${label}을 삭제할까요?`)) return;
  if (coll === 'fit') S.fitness.records = S.fitness.records.filter((x) => x.id !== id);
  else if (coll === 'diary') delete S.diary[id];
  else S[coll] = S[coll].filter((x) => String(x.id) !== id);
  if (coll === 'leaves') closeSheet();
  save();
}
function handleNew(t, d) {
  if (d.del) { delItem(d.del); return true; }
  if (d.sub && !d.go) { sub = d.sub; render(true); scrollTo(0, 0); return true; }
  if ('back' in d) { sub = null; render(true); scrollTo(0, 0); return true; }
  if (d.segk) {
    const k = d.segk; if (SEG[k] === d.seg) return true; SEG[k] = d.seg;
    const bar = t.closest('.seg'), btns = [...bar.querySelectorAll('button')], i = btns.indexOf(t);
    bar.querySelector('.sind').style.transform = `translateX(${i * 100}%)`; btns.forEach((b) => b.classList.toggle('on', b === t));
    setTimeout(() => render('seg'), 200); return true;
  }
  if (d.mnav) { const [k, n] = d.mnav.split(':'); MON[k] = L.addMonths(`${MON[k]}-01`, Number(n)).slice(0, 7); render(); return true; }
  if (d.plan) { SHEETS.plan(d.plan); return true; }
  if (d.mood) {
    const v = Number(d.mood); S.diary[today] = { ...(S.diary[today] || {}), mood: v };
    const inForm = t.closest('form[data-form="diary"]');
    if (inForm) { inForm.querySelectorAll('.mood').forEach((b) => b.classList.toggle('on', b === t)); t.classList.add('pop'); save(true); return true; }
    navigator.vibrate?.(10); save(); const nb = document.querySelector(`.mood[data-mood="${v}"]`); nb?.classList.add('pop'); toast(`오늘 기분: ${L.MOODS[v - 1].n} ${L.MOODS[v - 1].e}`); return true;
  }
  if ('cd' in d) { cdMode = CD_MODES[(CD_MODES.indexOf(cdMode) + 1) % CD_MODES.length]; try { localStorage.setItem(KEY + '.cd', cdMode); } catch (_) {} $('#liveCd').textContent = liveCountdown(); t.classList.remove('flip'); void t.offsetWidth; t.classList.add('flip'); return true; }
  if ('celebrateTest' in d) { celebrateQueue([{ key: 'test', emoji: '💸', title: L.pick(L.FUN.paydayTitle, String(Date.now())), msg: '미리보기예요! 진급·월급날·생일·기념일·복무율 돌파한 날에 이렇게 떠요.', action: 'book' }]); return true; }
  if (d.theme) { S.widgetTheme = d.theme; save(); toast(`위젯 테마: ${L.WIDGET_THEMES.find((x) => x.key === d.theme).name}`); return true; }
  const lid = $('#sheetBody').dataset.leave, l = lid && S.leaves.find((x) => x.id === lid);
  if (d.pchk != null && l) { const c = l.plan.checklist[Number(d.pchk)]; c.done = !c.done; t.classList.toggle('on', c.done); t.classList.add('pop'); t.nextElementSibling.querySelector('b').style.cssText = c.done ? 'text-decoration:line-through;color:var(--sub)' : ''; save(true); return true; }
  if (d.pdel != null && l) { l.plan.checklist.splice(Number(d.pdel), 1); $('#pck').innerHTML = l.plan.checklist.map(pckRow).join(''); save(true); return true; }
  if (d.padd && l) { const v = $('#pnew').value.trim(); if (!v) return true; l.plan.checklist.push({ t: v, done: false }); $('#pck').innerHTML = l.plan.checklist.map(pckRow).join(''); $('#pnew').value = ''; save(true); return true; }
  return false;
}
document.addEventListener('submit', (e) => {
  const f = e.target; if (f.dataset.form !== 'diary') return; e.preventDefault();
  const text = new FormData(f).get('text').trim();
  S.diary[today] = { ...(S.diary[today] || {}), text };
  if (!S.diary[today].mood && !text) delete S.diary[today];
  save(); toast('일기를 저장했어요 📔');
});

/* ============ 이벤트 ============ */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button,[data-day],[data-plan],[data-go]'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (handleNew(t, d)) return;
  if (d.add) return SHEETS[d.add]();
  if (d.edit) return SHEETS[d.edit]();
  if (d.go) { tab = d.go; if (d.seg) SEG.plan = d.seg; sub = d.sub || null; history.replaceState(null, '', '#' + tab); render(true); scrollTo(0, 0); return; }
  if (d.goal) {
    const g = S.goals.find((x) => x.id === d.goal); g.logs = g.logs || {};
    const checking = !g.logs[today];
    if (checking) { g.logs[today] = true; navigator.vibrate?.(15); confetti(t); } else delete g.logs[today];
    save();
    const nb = document.querySelector(`[data-goal="${d.goal}"]`);
    if (nb) { nb.classList.add('pop'); if (checking) { const it = nb.closest('.item'); it?.classList.add('done-flash'); setTimeout(() => it?.classList.remove('done-flash'), 600); } }
    if (checking && S.goals.every((x) => x.logs?.[today])) setTimeout(() => toast('오늘 목표 전부 달성! 🎉'), 350);
    return;
  }
  if (d.day) { selDay = d.day; if (d.day.slice(0, 7) !== calYM) calYM = d.day.slice(0, 7); return render(); }
  if (d.cal) { const [y, m] = calYM.split('-').map(Number); const nm = m + Number(d.cal); const dt = new Date(Date.UTC(y, nm - 1, 1)); calYM = dt.toISOString().slice(0, 7); return render(); }
  if (d.delEv && confirm('이 일정을 삭제할까요?')) { S.events = S.events.filter((x) => x.id !== d.delEv); return save(); }
  if (d.delLeave && confirm('이 출타 기록을 삭제할까요?')) { S.leaves = S.leaves.filter((x) => x.id !== d.delLeave); return save(); }
  if (d.delGoal && confirm('이 목표를 삭제할까요? 기록도 함께 지워져요.')) { S.goals = S.goals.filter((x) => x.id !== d.delGoal); return save(); }
  if ('push' in d) {
    t.disabled = true; t.textContent = '연결 중…';
    try { await Cloud.enablePush(); toast('알림이 켜졌어요 ⚓'); } catch (err) { alert(err.message || err); }
    return render();
  }
  if (d.wkey) {
    if (d.wkey === 'reset' && !confirm('키를 재발급하면 기존 위젯 연결이 끊겨요. 계속할까요?')) return;
    if (d.wkey === 'reset' && S.widgetKey && Cloud.on) { try { await Cloud.fs.deleteDoc(Cloud.fs.doc(Cloud.db, 'widgets', S.widgetKey)); } catch (_) {} }
    const a = new Uint8Array(18); crypto.getRandomValues(a); S.widgetKey = [...a].map((b) => b.toString(16).padStart(2, '0')).join('');
    return save();
  }
  if ('showSn' in d) { const sp = $('[data-sn]'); const on = t.textContent === '보기'; sp.textContent = on ? S.profile.serviceNo : S.profile.serviceNo.replace(/.(?=.{4})/g, '•'); t.textContent = on ? '숨기기' : '보기'; return; }
  if ('copyW' in d) { await navigator.clipboard?.writeText($('#wcode').innerText); return toast('복사했어요'); }
  if ('backup' in d) {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `군생활관리-백업-${today}.json`; a.click(); return;
  }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.notify) { S.notify[el.dataset.notify] = el.checked; save(true); toast(el.checked ? '알림 켬' : '알림 끔'); }
  if ('restore' in el.dataset && el.files[0]) {
    try { const d = JSON.parse(await el.files[0].text()); if (!d.profile) throw 0; if (!confirm('현재 데이터를 백업 파일로 바꿀까요?')) return; S = merge(L.defaultData(), d); save(); toast('복원했어요'); }
    catch (_) { alert('올바른 백업 파일이 아니에요'); }
  }
});

/* ============ 렌더 ============ */
const VIEWS = { home: viewHome, leave: viewLeave2, pay: viewMoneyTab, plan: viewPlan, more: viewMore };
function render(anim) {
  today = L.kstToday(); renderTabs();
  const v = $('#view');
  v.className = ''; v.innerHTML = VIEWS[tab]();
  if (anim) {
    // 'seg'는 세그먼트 아래 내용만 다시 등장
    const kids = [...v.children], si = anim === 'seg' ? kids.findIndex((el) => el.classList.contains('seg')) : -1;
    kids.forEach((el, i) => { el.style.setProperty('--i', Math.max(0, i - si - 1)); if (i <= si) el.style.animation = 'none'; });
    v.querySelectorAll('.grid>.stat,.grid3>.stat').forEach((el, j) => el.style.setProperty('--j', j));
    void v.offsetWidth; v.className = 'anim';
    countUp(v);
    driveForklift();
  } else {
    const svg = v.querySelector('.voyage svg');
    if (svg) { const fk = svg.querySelector('.fk'), tr = svg.querySelector('.trail');
      fk.style.transition = tr.style.transition = 'none'; fk.style.transform = `translate(${svg.dataset.tx}px,17px)`; tr.style.strokeDashoffset = svg.dataset.trail; fk.classList.add('arrived');
      svg.onclick = () => { fk.style.transition = tr.style.transition = ''; driveForklift(); }; }
  }
  FunCar.bind();
}
if (bootSub) sub = bootSub;
render(true);
// 복무율 · 전역 카운트다운 실시간 갱신
setInterval(() => {
  const el = $('#livePct'); if (el) el.textContent = livePct().toFixed(7);
}, 100);
setInterval(() => {
  const cd = $('#liveCd'); if (cd) cd.textContent = liveCountdown();
  if (L.kstToday() !== today) { render(true); showCelebrations(); }
}, 1000);
setTimeout(showCelebrations, 900);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); if (Cloud.ready) Cloud.pull(); setTimeout(showCelebrations, 500); } });
Cloud.init();
</script>
